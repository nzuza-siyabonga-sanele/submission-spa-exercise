<!DOCTYPE html>
<html>

<head>
    <title>A Simple SPA</title>
    <link href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAOjv4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABEBEAAAAAEBAAABAQAAAQEREREBAAABEREREREAAAARAREBEAAAAAEREREAAAAAABAAEAAAAAAAEAAQAAAAAAEAAAEAAAAAAAAAAAAAAAAAAAAAAAD//wAA//8AAP//AAD//wAA//8AAPyfAADr6wAA6AsAAOADAADyJwAA+A8AAP3fAAD93wAA++8AAP//AAD//wAA"
            rel="icon" type="image/x-icon" />
</head>

<body>
    <nav>
        <a id="dictionary" href="#/dictionary">Dictionary</a>
        <a id="synonyms" href="#/synonyms">Synonyms</a>
        <a id="antonyms" href="#/antonyms">Antonyms</a>
    </nav>

    <br/>
    <div id="app">Click on a menu item.</div>

    <script id="default-template" type="text/handlebars-template"></script>

    <script id="dictionary-template" type="text/handlebars-template">
        <h1>Dictionary</h1>
        <br/>
        <form id="lookup-form">
            <input id="lookup" name="word" type="text" required/>
            <input name="submit" type="submit" value="Lookup"/>
        </form>
        <br/>
        <div id="results"></div>
    </script>

    <script id="synonyms-template" type="text/handlebars-template">
        <h1>Synonyms</h1>
        <br/>
        <form id="lookup-form">
            <input id="lookup" name="word" type="text" required/>
            <input name="submit" type="submit" value="Lookup"/>
        </form>
        <br/>
        <div id="results"></div>
    </script>

    <script id="synonyms_results-template" type="text/handlebars-template">
        <h2 id="word">{{word}}</h2>
        <p>{{synonyms}}</p>
        <div class="related-word">
            <h3>Related</h3>
            <ol>
                {{#each my}}
                <li>{{this.synonyms}}
                {{/each}}
            </ol>
        </div>
        <br/>
    </script>

    <script id="antonyms-template" type="text/handlebars-template">
        <h1>Antonyms</h1>
        <br/>
        <form id="lookup-form">
            <input id="lookup" name="word" type="text" required/>
            <input name="submit" type="submit" value="Lookup"/>
        </form>
        <br/>
        <div id="results"></div>
    </script>

    <script id="antonyms_results-template" type="text/handlebars-template">
        <h3 id="word">{{word}}</h3>
        <ol>
            {{#each my}}
            <li>{{this.antonyms}}
            {{/each}}
        </ol>
        <br/>
        <div class="related-word">
            <h3>Related</h3>
            <ol>
                {{#each my}}
                <li>{{this.synonyms}}
                {{/each}}
            </ol>
        </div>
        <br/>
    </script>

    <script id="results-template" type="text/handlebars-template">
        <h2 id="word">{{word}}</h2>
        <h2 id="phonetic">{{phonetic}}</h2>
        <div>
            <audio controls src="{{src}}"></audio>
        </div>
        <h3>Meanings</h3>
        <ol>
            {{#each fdd}}
            <div class="part-of-speech">
                <h4>{{this.partOfSpeech}}</h4>
            </div>
            {{#each this.definitions}}
            <div class="definition">
                <li>{{this.definition}}
            </div>
                {{/each}}
            {{/each}}
        </ol>

        <h3>Examples</h3>
        <div class="example">
            <ol>
                {{#each fdd}}
                    {{#each this.definitions}}
                    <li>{{this.example}}
                    {{/each}}
                {{/each}}
            </ol>
        </div>
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.min.js"></script>

    <!-- the vanilla-router library-->
    <script src="https://cdn.jsdelivr.net/npm/vanilla-router@1.2.8/index.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.1/dist/jquery.min.js"></script>

    <script src="/js/app.js"></script>
</body>

</html>
